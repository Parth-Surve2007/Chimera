[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "0.1.0"
description = "Local-first capability engine foundation"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
chimera = "chimera.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

