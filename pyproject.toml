[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "0.1.0"
description = "Local-first capability engine foundation"
requires-python = ">=3.11"
dependencies = ["flet>=1.0", "pywinauto>=0.6.9; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pydantic>=2", "psutil>=5.9", "Pillow>=10"]

[project.scripts]
chimera = "chimera.app:main"

[tool.setuptools.packages.find]
include = ["chimera*", "chimera_provider_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

